name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The api tests run on a real Postgres. These values match apps/api/docker-compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: api
          POSTGRES_USER: api
          POSTGRES_PASSWORD: local-api
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U api -d api"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Nx needs history to work out which projects a change affects.
          fetch-depth: 0

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # Node comes from .nvmrc. vue-tsc 2.x crashes on Node 25, so keep this on 24.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD so `nx affected` and `nx format:check`
      # compare against the right commit on both PRs and pushes to main.
      - uses: nrwl/nx-set-shas@v4

      # desktop-web's lint and typing read auto-import files that are generated
      # and gitignored (auto-imports.d.ts, components.d.ts, .eslintrc-auto-import.json).
      # Running any spec makes the Vite plugins emit them.
      - name: Generate auto-import typings
        run: pnpm --filter animefork exec vitest run src/logic/noop.spec.ts

      - name: Check formatting
        run: pnpm nx format:check

      - name: Lint, typecheck and test
        run: pnpm nx affected -t lint typecheck typing test

      # desktop-web is excluded until its rebuild; its Quasar build was never part of CI.
      - name: Build
        run: pnpm nx affected -t build --exclude=animefork
